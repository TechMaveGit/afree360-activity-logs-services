name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: npm install
        run: npm install

  cd:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd /var/www/html/backendafree360/afree360-activity-logs-services

            # Pull latest code
            git reset --hard origin/main
            git pull origin main

            # Clean npm cache
            npm cache clean --force

            # Install dependencies
            npm install

            # Run migrations
            npx knex migrate:latest

            # Restart PM2
            #pm2 restart freely-app || pm2 start ecosystem.config.js --only freely-app
            pm2 restart afree360-activity-logs-services 

            
